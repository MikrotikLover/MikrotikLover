<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<!-- straight on when there is no warning; with a warning the user reads it first (8 seconds) -->
$(if radius18)<meta http-equiv="refresh" content="8; url=$(link-redirect)">$(else)<meta http-equiv="refresh" content="1; url=$(link-redirect)">$(endif)
<title>Logged in</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:linear-gradient(135deg,#1d4ed8,#0ea5e9); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:16px; }
  .card { width:100%; max-width:380px; background:#fff; border-radius:18px; padding:24px 22px; box-shadow:0 20px 50px rgba(0,0,0,.25); text-align:center; }
  .warn { background:#fff7ed; border:1px solid #fdba74; color:#9a3412; border-radius:12px; padding:12px 14px; margin:14px 0; font-size:15px; line-height:1.45; text-align:left; }
  a { display:block; margin-top:12px; padding:12px; font-weight:700; color:#fff; background:#2563eb; border-radius:10px; text-decoration:none; }
  .logo { display:block; max-width:160px; max-height:80px; margin:0 auto 10px; }
  .ad { background:#eff6ff; border:1px solid #bfdbfe; color:#1e3a8a; border-radius:10px; padding:10px 12px; margin:8px 0 12px; font-size:14px; text-align:center; }
</style>
</head>
<body>
<div class="card">
  <!--ML-LOGO-->
  <h2>Login ho gaya ✓</h2>
  $(if radius18)<div class="warn"><b>⚠ Khabardar:</b> $(radius18)</div>$(endif)
  <!--ML-NOTICE-->
  <a href="$(link-redirect)">Aage barhein</a>
</div>
</body>
</html>
